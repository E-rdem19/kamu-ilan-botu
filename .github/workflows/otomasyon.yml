name: Kamu Ilan Otomatik Tarayici

on:
  schedule:
    # Günde 3 kez çalışır (UTC saatine göredir: TR saati ile ~09:00, ~14:00, ~19:00)
    - cron: '0 6,11,16 * * *'
  workflow_dispatch: # İstediğin zaman "Run workflow" butonuna basarak elle de çalıştırabilirsin

permissions:
  contents: write # Görülen ilanlar dosyasını repoya kaydedebilmek için

jobs:
  tara-ve-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri ve Playwright'ı Yukle
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Kamu İlan Botunu Calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Görülen İlanlar Dosyasını Kaydet (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gorulen_ilanlar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Hafıza güncellendi: Yeni ilanlar kaydedildi [skip ci]" && git push)
