name: Kariyer Kapisi API Dedektifi

on:
  workflow_dispatch:

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4 urllib3

      - name: Otomatik Dedektifi Calistir
        run: |
          cat << 'EOF' > dedektif.py
          import requests
          import urllib3
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urllib3.disable_warnings()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "tr-TR,tr;q=0.9"
          }

          url = "https://kariyerkapisi.gov.tr/isealim"
          r = requests.get(url, headers=headers, timeout=15, verify=False)
          soup = BeautifulSoup(r.text, "html.parser")

          scripts = [s.get("src") for s in soup.find_all("script") if s.get("src")]

          print("=" * 50)
          print(f"BULUNAN JS DOSYALARI ({len(scripts)} adet)")
          print("=" * 50)

          api_adaylari = set()

          for s_url in scripts:
              tam_url = urljoin(url, s_url)
              if any(k in tam_url for k in ["google", "jquery", "bootstrap", "font"]):
                  continue
              print(f"Inceleniyor: {tam_url}")
              try:
                  js_cevap = requests.get(tam_url, headers=headers, timeout=10, verify=False)
                  bulunanlar = re.findall(r"['\"`](/[a-zA-Z0-9_\-/]+)[\"'`]", js_cevap.text)
                  for b in bulunanlar:
                      if any(x in b.lower() for x in ["ilan", "isealim", "api", "get", "list", "filter"]):
                          api_adaylari.add(b)
              except Exception as e:
                  print(f"Hata ({tam_url}): {e}")

          print("\n" + "=" * 50)
          print("YAKALANAN OLASI API VE ADRESLER:")
          print("=" * 50)
          for api in sorted(api_adaylari):
              print("->", api)
          EOF
          python dedektif.py
