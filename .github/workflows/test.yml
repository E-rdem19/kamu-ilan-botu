name: Kariyer Kapisi Hizli Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests urllib3

      - name: APIyi Hizlica Sorgula
        run: |
          cat << 'EOF' > hizli_test.py
          import requests
          import urllib3
          import json

          urllib3.disable_warnings()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/json",
              "Origin": "https://kariyerkapisi.gov.tr",
              "Referer": "https://kariyerkapisi.gov.tr/isealim"
          }

          urls = [
              "https://api.kariyerkapisi.gov.tr/api/ilan/GetIseAlimPage",
              "https://api.kariyerkapisi.gov.tr/api/ilan/SearchIlanPublic"
          ]

          for u in urls:
              print("=" * 50)
              print("Deneniyor:", u)
              try:
                  r = requests.post(u, headers=headers, json={}, timeout=10, verify=False)
                  print(f"Durum Kodu: {r.status_code}")
                  print(f"İçerik Türü: {r.headers.get('content-type')}")
                  if r.status_code == 200:
                      veri = r.json()
                      print("BAŞARILI! Dönen veri türü:", type(veri))
                      if isinstance(veri, dict):
                          print("Anahtarlar:", list(veri.keys()))
                          # İlk liste alanını bulup göster
                          for k, v in veri.items():
                              if isinstance(v, list):
                                  print(f"'{k}' içinde {len(v)} öğe var.")
                                  if len(v) > 0:
                                      print("Örnek öğe:\n", json.dumps(v[0], indent=2, ensure_ascii=False)[:600])
                      elif isinstance(veri, list):
                          print(f"Toplam {len(veri)} adet ilan geldi!")
                          if len(veri) > 0:
                              print("İlk ilan:\n", json.dumps(veri[0], indent=2, ensure_ascii=False)[:600])
                  else:
                      print("Yanıt metni (ilk 200 karakter):", r.text[:200])
              except Exception as e:
                  print("Hata:", e)
          EOF
          python hizli_test.py
