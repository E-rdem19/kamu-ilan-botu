name: Kariyer Kapisi Canli Yakalama

on:
  workflow_dispatch:

jobs:
  yakala:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Sayfadaki Butun Ag Isteklerini Gor
        run: |
          cat << 'EOF' > kk_test.py
          import time
          from playwright.sync_api import sync_playwright

          url = "https://kariyerkapisi.gov.tr/isealim"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              ctx = browser.new_context(locale="tr-TR", ignore_https_errors=True)
              page = ctx.new_page()

              tum_istekler = []

              def on_request(r):
                  # Resim, yazı tipi ve css hariç her isteği topla
                  if r.resource_type in ["fetch", "xhr"]:
                      tum_istekler.append((r.method, r.url))

              page.on("request", on_request)
              
              page.goto(url, wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(3000)

              print("=" * 50)
              print(f"SAYFADAN GIDEN AJAX / FETCH ISTEKLERI ({len(tum_istekler)} adet):")
              print("=" * 50)
              for method, u in tum_istekler:
                  print(f"[{method}] -> {u}")

              print("\n" + "=" * 50)
              print("SAYFADA TIKLANABILIR BUTONLAR:")
              print("=" * 50)
              butonlar = page.locator("button, a.btn, input[type=submit]").all_text_contents()
              for b in butonlar:
                  if b.strip():
                      print("-> Buton:", b.strip())

              browser.close()
          EOF
          python kk_test.py
