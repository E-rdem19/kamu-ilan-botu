name: Kariyer Kapisi Veri Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests urllib3

      - name: Veri Servisini Cagir
        run: |
          cat << 'EOF' > veri_test.py
          import requests
          import urllib3
          import json

          urllib3.disable_warnings()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest",
              "Content-Type": "application/json; charset=UTF-8",
              "Referer": "https://kariyerkapisi.gov.tr/isealim"
          }

          url = "https://kariyerkapisi.gov.tr/ilan/SearchIlanPublic"
          
          # Boş arama (tüm güncel ilanları getir)
          payload = {}

          try:
              # Hem POST hem GET deneyelim
              r = requests.post(url, headers=headers, json=payload, timeout=15, verify=False)
              print(f"POST Durum Kodu: {r.status_code}")
              print(f"Cevap Türü: {r.headers.get('content-type')}")
              
              veri = r.json()
              print("\nBAŞARILI! DÖNEN VERİ TİPİ:", type(veri))
              
              # Dönen ilk 2 ilanı ekrana bas
              if isinstance(veri, list):
                  print(f"Toplam İlan Sayısı: {len(veri)}")
                  for i, ilan in enumerate(veri[:2], 1):
                      print(f"\n--- ÖRNEK İLAN {i} ---")
                      print(json.dumps(ilan, indent=2, ensure_ascii=False))
              elif isinstance(veri, dict):
                  print("Anahtar kelimeler:", list(veri.keys()))
                  for k, v in veri.items():
                      if isinstance(v, list):
                          print(f"'{k}' listesinde {len(v)} adet eleman var.")
                          if len(v) > 0:
                              print("\n--- ÖRNEK İLAN DETAYI ---")
                              print(json.dumps(v[0], indent=2, ensure_ascii=False)[:1000])
                          break
          except Exception as e:
              print("POST Hatası:", e)
              print("İlk 200 karakter:", r.text[:200] if 'r' in locals() else "Yok")
          EOF
          python veri_test.py
