name: Kariyer Kapisi Inceleme

on:
  workflow_dispatch:

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4 urllib3

      - name: Kartlari Coz
        run: |
          python -c '
          import requests
          import urllib3
          from bs4 import BeautifulSoup

          urllib3.disable_warnings()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "tr-TR,tr;q=0.9"
          }

          r = requests.get("https://kariyerkapisi.gov.tr/isealim", headers=headers, timeout=15, verify=False)
          soup = BeautifulSoup(r.text, "html.parser")

          kartlar = soup.find_all(class_=lambda x: x and ("card" in x or "ilan" in x or "item" in x))

          print("=" * 50)
          print(f"TOPLAM BULUNAN KART SAYISI: {len(kartlar)}")
          print("=" * 50)

          for i, kart in enumerate(kartlar[:3], 1):
              print(f"\n--- KART {i} ---")
              print("Metin:\n", kart.get_text(separator=" | ", strip=True)[:300])
              # Kart içindeki tüm linkler ve butonlar
              linkler = kart.find_all(["a", "button"])
              for l in linkler:
                  print("  -> Etiket:", l.name, "| Href:", l.get("href"), "| Onclick:", l.get("onclick"), "| Buton Metni:", l.get_text(strip=True))
          '
