name: Asama 1 Telegram Testi

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Sahte İlan ve PDF Gönderim Testi
        env:
          TELEGRAM_BOT_TOKEN: "9113978201:AAEsXAsPOc7fVXpFTqrNowIXdQ8AEFL8zxs"
          TELEGRAM_CHAT_ID: "-1003782441383"
        run: |
          python -c '
          import time
          from telegram_sender import TelegramSender

          print("Telegram gönderici başlatılıyor...")
          sender = TelegramSender()

          # Sahte test ilanı
          ornek_ilan = {
              "kaynak_site": "test_sistemi",
              "ilan_id": "99999",
              "baslik": "Mühendis ve Büro Personeli Alımı (TEST İLANI)",
              "kurum": "T.C. Çevre, Şehircilik ve İklim Değişikliği Bakanlığı",
              "il": "Ankara",
              "son_basvuru_tarihi": "15.12.2026",
              "link": "https://kariyerkapisi.gov.tr"
          }

          print("1. İlan mesajı gönderiliyor...")
          mesaj_id = sender.mesaj_gonder(ornek_ilan)
          print(f"Mesaj başarıyla gitti! Telegram Mesaj ID: {mesaj_id}")

          time.sleep(2)

          print("2. Örnek PDF indiriliyor ve mesaja yanıt olarak yükleniyor...")
          ornek_pdf = "https://raw.githubusercontent.com/mozilla/pdf.js/master/examples/learning/helloworld.pdf"
          sonuc = sender.pdf_gonder(ornek_pdf, "Bakanlik_Ilan_Metni_Test.pdf", yanitlanacak_mesaj_id=mesaj_id)

          if sonuc:
              print("BAŞARILI: PDF ilanın altına yanıt olarak eklendi! 🎉")
          else:
              print("PDF gönderilirken bir sorun oluştu.")
          '
