name: IlanGovTr Dedektif Testi

on:
  workflow_dispatch:

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4

      - name: Sayfa Icerigini Coz
        run: |
          python -c '
          import requests
          from bs4 import BeautifulSoup

          url = "https://www.ilan.gov.tr/ilan/tum-ilanlar/personel-alimi?ats=5"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          cevap = requests.get(url, headers=headers, timeout=15)
          print(f"Durum Kodu: {cevap.status_code}")
          
          soup = BeautifulSoup(cevap.text, "html.parser")
          
          # Sayfa başlığını kontrol et
          print("Sayfa Başlığı:", soup.title.string if soup.title else "Başlık yok")
          
          # İlan kartlarını arayalım
          ilan_linkleri = soup.find_all("a", href=True)
          bulunan_ilanlar = []
          for a in ilan_linkleri:
              href = a["href"]
              if "/ilan/" in href and href != "/ilan/tum-ilanlar/personel-alimi?ats=5":
                  metin = a.get_text(strip=True)
                  if metin and len(metin) > 10:
                      bulunan_ilanlar.append((metin, href))

          print(f"\nToplam bulunan olası ilan bağlantısı: {len(bulunan_ilanlar)}")
          for baslik, link in bulunan_ilanlar[:5]:
              print(f"-> Başlık: {baslik[:60]}... | Link: {link}")
          '
