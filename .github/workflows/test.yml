name: Kariyer Kapisi Canli Yakalama

on:
  workflow_dispatch:

jobs:
  yakala:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Kariyer Kapisini Ac ve Veriyi Yakala
        run: |
          cat << 'EOF' > kk_test.py
          import json
          import time
          from playwright.sync_api import sync_playwright

          url = "https://kariyerkapisi.gov.tr/isealim"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              ctx = browser.new_context(locale="tr-TR", ignore_https_errors=True)
              page = ctx.new_page()

              yakalanan_veriler = []

              def on_response(r):
                  # İlanlarla ilgili servisleri yakala
                  if any(k in r.url.lower() for k in ["search", "ilan", "isealim"]):
                      try:
                          ct = r.headers.get("content-type", "")
                          if "json" in ct:
                              data = r.json()
                              yakalanan_veriler.append((r.url, data))
                              print(f"[YAKALANDI] -> URL: {r.url}")
                      except:
                          pass

              page.on("response", on_response)
              
              print("Sayfa açılıyor...")
              # networkidle yerine domcontentloaded ile anında geçiyoruz
              page.goto(url, wait_until="domcontentloaded", timeout=30000)
              print("Sayfa başlığı:", page.title())
              
              # İlanların yüklenmesi için 4 saniye bekle
              page.wait_for_timeout(4000)

              print(f"\nToplam yakalanan JSON servisi sayısı: {len(yakalanan_veriler)}")
              for istek_url, veri in yakalanan_veriler:
                  print("=" * 50)
                  print("SERVIS URL:", istek_url)
                  if isinstance(veri, list):
                      print(f"Liste uzunluğu: {len(veri)} adet")
                      if len(veri) > 0:
                          print("İlk eleman örneği:\n", json.dumps(veri[0], indent=2, ensure_ascii=False)[:600])
                  elif isinstance(veri, dict):
                      print("Sözlük anahtarları:", list(veri.keys()))
                      print("Örnek veri:\n", json.dumps(veri, indent=2, ensure_ascii=False)[:600])

              browser.close()
          EOF
          python kk_test.py
