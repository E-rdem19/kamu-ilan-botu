name: API Bulucu Test

on:
  workflow_dispatch:

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4 urllib3

      - name: Olası Adresleri Tara
        run: |
          python -c '
          import requests
          import urllib3

          urllib3.disable_warnings()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://www.ilan.gov.tr/ilan/tum-ilanlar/personel-alimi?ats=5"
          }

          # Sitenin olası arka plan API adresleri
          denenecek_adresler = [
              "https://www.ilan.gov.tr/api/classifieds/search?ats=5",
              "https://www.ilan.gov.tr/api/classified/search?ats=5",
              "https://www.ilan.gov.tr/api/search?ats=5",
              "https://www.ilan.gov.tr/api/classifieds?ats=5",
              "https://www.ilan.gov.tr/api/v1/classifieds?ats=5",
              "https://www.ilan.gov.tr/api/classifieds/list?ats=5",
              "https://www.ilan.gov.tr/ilan/kategori/8/kamu-akademik-personel?ats=5"
          ]

          print("=" * 50)
          print("ILAN.GOV.TR API ADRESLERI TARANIYOR...")
          print("=" * 50)

          for url in denenecek_adresler:
              try:
                  r = requests.get(url, headers=headers, timeout=10, verify=False)
                  content_type = r.headers.get("content-type", "")
                  print(f"URL: {url} -> Kod: {r.status_code} | Tip: {content_type[:20]}")
                  if r.status_code == 200 and "json" in content_type:
                      print(f"--> BINGO! JSON API BULUNDU: {url}")
                      print(f"--> Veri Ornegi: {r.text[:200]}")
                      break
              except Exception as e:
                  print(f"URL: {url} -> HATA: {e}")
          '
