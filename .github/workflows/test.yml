name: Kariyer Kapisi Canli Yakalama

on:
  workflow_dispatch:

jobs:
  yakala:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: GetIseAlimPage Verisini Yakala
        run: |
          cat << 'EOF' > kk_test.py
          import json
          import time
          from playwright.sync_api import sync_playwright

          url = "https://kariyerkapisi.gov.tr/isealim"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              ctx = browser.new_context(locale="tr-TR", ignore_https_errors=True)
              page = ctx.new_page()

              yakalanan_veri = {}

              def on_response(r):
                  if "GetIseAlimPage" in r.url:
                      print(f"\n[YAKALANDI] Durum Kodu: {r.status}")
                      print(f"İstek Başlıkları: {dict(r.request.headers)}")
                      print(f"İstek Gövdesi (Payload): {r.request.post_data}")
                      try:
                          yakalanan_veri["data"] = r.json()
                      except Exception as e:
                          print("JSON okunamadı:", e)

              page.on("response", on_response)
              
              page.goto(url, wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(4000)

              veri = yakalanan_veri.get("data")
              if veri:
                  print("=" * 50)
                  print("KARIYER KAPISI ILANLARI BASARIYLA ALINDI!")
                  print("=" * 50)
                  # Dönen verinin yapısını görelim
                  if isinstance(veri, dict):
                      print("Sözlük Anahtarları:", list(veri.keys()))
                      # Muhtemelen 'ilanlar' veya 'data' gibi bir liste vardır
                      for k, v in veri.items():
                          if isinstance(v, list):
                              print(f"\n'{k}' listesinde {len(v)} adet eleman var!")
                              if len(v) > 0:
                                  print("İlk İlan Örneği:\n", json.dumps(v[0], indent=2, ensure_ascii=False)[:800])
                  elif isinstance(veri, list):
                      print(f"Toplam İlan: {len(veri)}")
                      print("İlk İlan Örneği:\n", json.dumps(veri[0], indent=2, ensure_ascii=False)[:800])
              else:
                  print("Veri henüz yakalanamadı.")

              browser.close()
          EOF
          python kk_test.py
