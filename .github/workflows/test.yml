name: Kariyer Kapisi API Dedektifi

on:
  workflow_dispatch:

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4 urllib3

      - name: Dedektifi Calistir
        run: python dedektif.py
