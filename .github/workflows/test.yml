name: API URL Yakala

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests urllib3

      - name: Adresi Yakala
        run: |
          cat << 'EOF' > adresi_bul.py
          import requests
          import urllib3
          import re

          urllib3.disable_warnings()
          headers = {"User-Agent": "Mozilla/5.0"}
          
          # 1. Ana sayfanın HTML kodundaki tanımlara bakalım
          r = requests.get("https://kariyerkapisi.gov.tr/isealim", headers=headers, verify=False)
          eslesmeler = re.findall(r"apiURL\s*[:=]\s*['\"`]([^'\"`]+)['\"`]", r.text, re.IGNORECASE)
          print("HTML'den bulunan apiURL:", eslesmeler)

          # 2. Infrastructure JS dosyasındaki tanımlara bakalım
          r2 = requests.get("https://kariyerkapisi.gov.tr/js/Infrastructure.ncmia0gyd4.js", headers=headers, verify=False)
          eslesmeler2 = re.findall(r"apiURL\s*[:=]\s*['\"`]([^'\"`]+)['\"`]", r2.text, re.IGNORECASE)
          print("JS'den bulunan apiURL:", eslesmeler2)
          
          # Eğer çıkmazsa iko.var tanımını yakalayalım
          for m in re.finditer(r"apiURL", r2.text):
              baslangic = max(0, m.start() - 50)
              bitis = min(len(r2.text), m.end() + 100)
              print("Etrafındaki kod:", r2.text[baslangic:bitis])
              break
          EOF
          python adresi_bul.py
