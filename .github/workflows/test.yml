name: Erisim Testi

on:
  workflow_dispatch:

jobs:
  test-siteler:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yukle
        run: pip install requests urllib3

      - name: Gelismis Basliklarla Test Et
        run: |
          python -c '
          import requests
          import time

          siteler = {
              "Kamuilan (SBB)": "https://kamuilan.sbb.gov.tr",
              "Yerel Yonetimler (CSB)": "https://yerelyonetimler.csb.gov.tr",
              "Ilan Gov Tr": "https://www.ilan.gov.tr/ilan/tum-ilanlar/personel-alimi?ats=5",
              "Kariyer Kapisi": "https://kariyerkapisi.gov.tr/isealim"
          }

          # Gercek bir Turkce Chrome tarayicisi kimligi
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          session = requests.Session()
          session.headers.update(headers)

          print("=" * 50)
          print("GELISMIS KIMLIKLI ERISIM TESTI")
          print("=" * 50)

          for ad, url in siteler.items():
              baslangic = time.time()
              try:
                  cevap = session.get(url, timeout=12, verify=False)
                  gecen_sure = round(time.time() - baslangic, 2)
                  print(f"[{ad}] -> Durum Kodu: {cevap.status_code} | Sure: {gecen_sure} sn")
              except Exception as e:
                  gecen_sure = round(time.time() - baslangic, 2)
                  print(f"[{ad}] -> HATA: {type(e).__name__} | Sure: {gecen_sure} sn")
          '
