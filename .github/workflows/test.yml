name: IlanGovTr Telegram Canli Test

on:
  workflow_dispatch:

jobs:
  canli-test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ilanlari Cek ve Kanala Gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > test_canli.py
          import time
          from adapters.ilan_gov_tr import IlanGovTrAdapter
          from telegram_sender import TelegramSender
          from database import Database

          print("1. Telegram ve Veritabanı başlatılıyor...")
          sender = TelegramSender()
          db = Database()

          print("2. ilan.gov.tr adaptörü çalıştırılıyor (İlk 3 ilan çekilecek)...")
          adapter = IlanGovTrAdapter(limit=3)
          ilanlar = adapter.ilanlari_getir()

          print(f"\n3. Toplam {len(ilanlar)} ilan alındı. Kanala gönderiliyor...")
          for ilan in ilanlar:
              b_id = ilan.benzersiz_id
              if db.ilan_goruldu_mu(b_id):
                  print(f"-> Zaten görülmüş, atlanıyor: {ilan.baslik[:40]}")
                  continue

              print(f"-> Kanala gönderiliyor: {ilan.baslik[:50]}")
              mesaj_id = sender.mesaj_gonder(ilan.to_dict())
              
              # Eğer PDF eki varsa gönder
              for ek in ilan.ek_dosyalar:
                  time.sleep(1.5)
                  print(f"   [PDF] Gönderiliyor: {ek['dosya_adi']}")
                  sender.pdf_gonder(ek["url"], ek["dosya_adi"], yanitlanacak_mesaj_id=mesaj_id)

              # Gönderildi olarak kaydet
              db.ilani_kaydet(b_id)
              time.sleep(2)

          print("\nBİTTİ! Tüm yeni ilanlar başarıyla kanala gönderildi! 🎉")
          EOF
          python test_canli.py
