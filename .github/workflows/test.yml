name: Istek Seklini Coz

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install requests urllib3

      - name: JS Kodunu Oku
        run: |
          cat << 'EOF' > oku.py
          import requests
          import urllib3
          import re

          urllib3.disable_warnings()
          headers = {"User-Agent": "Mozilla/5.0"}
          url = "https://kariyerkapisi.gov.tr/js/Index/Main.dit3odhcc9.js"
          
          r = requests.get(url, headers=headers, verify=False)
          
          # SearchIlanPublic kelimesinin geçtiği yerin etrafındaki 300 karakteri yakala
          for match in re.finditer(r"SearchIlanPublic", r.text):
              baslangic = max(0, match.start() - 100)
              bitis = min(len(r.text), match.end() + 250)
              print("=" * 50)
              print("YAKALANAN AJAX KODU:")
              print("=" * 50)
              print(r.text[baslangic:bitis])
          EOF
          python oku.py
